function drawTl(t){const s=+t.dataset.s;t.innerHTML=L7.map((l,i)=>`<div class="st ${i<s?'d':i==s?'c':''}"><i>${i<s?'✓':i+1}</i>${l}</div>`).join('')}
function toast(f,m){const t=$('.ts',f);t.textContent=m;t.hidden=false;clearTimeout(t.h);t.h=setTimeout(()=>t.hidden=true,1600)}
function bind(f){$$('.tl',f).forEach(drawTl);
 const send=t=>{if(!t.trim())return;const m=$('.ml',f),e=$('.emp',m);if(e)e.remove();m.insertAdjacentHTML('beforeend','<div class="bub me"></div>');m.lastChild.textContent=t;$('.ci',f).value='';m.scrollTop=1e5;setTimeout(()=>{m.insertAdjacentHTML('beforeend','<div class="bub">¡Claro! Te respondo enseguida ✨</div>');m.scrollTop=1e5},700)};
 const ci=$('.ci',f);if(ci)ci.onkeydown=e=>e.key=='Enter'&&send(ci.value);
 $('.si',f).oninput=e=>{const q=e.target.value.toLowerCase();$$('.cat2',f).forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')};
 let x0=null;f.onpointerdown=e=>{if(e.target.closest('.sw'))x0=e.clientX};f.onpointerup=e=>{if(x0!==null){const d=e.clientX-x0;x0=null;if(Math.abs(d)>70)sw(f,d>0)}};
 f.onclick=e=>{const t=e.target,cl=t.classList;
  if(cl.contains('yes')||cl.contains('no'))sw(f,cl.contains('yes'));
  if(cl.contains('pin')){$$('.pin',f).forEach(x=>x.classList.toggle('on',x==t));$('.mps',f).innerHTML='📍 <b>'+t.dataset.n+'</b> seleccionado ✓'}
  if(cl.contains('qf')){const i=$('.ci',f);i.value=t.textContent;i.focus()}
  if(cl.contains('hr')){cl.toggle('on');t.textContent=cl.contains('on')?'♥':'♡'}
  if(t.dataset.f){$$('.chip[data-f]',f).forEach(x=>x.classList.toggle('on',x==t));$$('.pc',f).forEach(p=>p.style.display=t.dataset.f=='todo'||p.dataset.c==t.dataset.f?'':'none')}
  if(cl.contains('dm')&&!cl.contains('xo')){const o=t.closest('.cd');if(o)o.remove()}
  if(cl.contains('fl')){cl.toggle('on');t.textContent=cl.contains('on')?'Siguiendo':'Seguir +'}
  if(cl.contains('cat2')||t.closest('.cat2')){$$('.cat2',f).forEach(x=>x.classList.remove('on'));(t.closest('.cat2')||t).classList.add('on')}
  if(t.parentNode.classList.contains('th')){$$('.th i',f).forEach(x=>x.classList.toggle('on',x==t));$('.gm',f).textContent=t.textContent}
  if(cl.contains('bu')){$('.cb',f).textContent=+$('.cb',f).textContent+1;toast(f,'✓ Agregado al carrito')}
  if(cl.contains('of')){const p=$('.ofp',f);p.hidden=!p.hidden}if(cl.contains('of2'))toast(f,'Oferta de '+t.textContent+' enviada')
  if(t.name&&t.name[0]=='p'){$$('label.rd',f).forEach(x=>x.classList.toggle('on',x.contains(t)));$('.cf',f).hidden=t.value=='e'}
  if(cl.contains('conf'))$('.ov',f).hidden=false;
  if(cl.contains('sim')){const x=$('.tl',f);x.dataset.s=Math.min(7,+x.dataset.s+1);drawTl(x)}
  if(t.dataset.t&&cl.contains('tb')){$$('.tb',f).forEach(x=>x.classList.toggle('on',x==t));$$('.tcn',f).forEach(x=>x.hidden=x.dataset.t!=t.dataset.t)}
  if(t.dataset.t&&cl.contains('tb2')){$$('.tb2',f).forEach(x=>x.classList.toggle('on',x==t));$('.pbt',f).textContent=t.dataset.t=='Públicos'?'No se encontraron productos publicados.':'Aún no tienes productos aquí.'}
  const s=t.closest('.sh');if(s)$('.inf',f).textContent=s.dataset.m;
  if(cl.contains('cs'))send($('.ci',f).value);if(cl.contains('qr'))send(t.textContent);
  if(cl.contains('faqb'))$('.ov',f).hidden=false;if(cl.contains('xo'))$('.ov',f).hidden=true;
  if(cl.contains('go2')){const p=$('.pf',f);p.hidden=!p.hidden;if(!p.hidden)p.scrollIntoView({behavior:'smooth',block:'center'})}
  if(cl.contains('slot')){cl.toggle('on');t.textContent=cl.contains('on')?'📷':'＋';$('.pb',f).disabled=!$('.slot.on',f)}}}
let k=0;const C={},O=S.map(()=>Math.random()<.5);
function render(){
 if(k>=S.length)return fin();const s=S[k];
 $('#pg').innerHTML=S.map((x,i)=>`<i class="${C[i]!==undefined?'dn':''} ${i==k?'on':''}" title="${x.t}"></i>`).join('');
 const ord=O[k]?[1,0]:[0,1];
 $('#ab').innerHTML=`<h2 style="text-align:center">${k+1}/${S.length} · ${s.t}</h2><div class="pair">`+ord.map((v,j)=>`<div class="fr${C[k]===v?' sel':''}"><div class="lb">Opción ${j+1}</div>${s.f(!v)}<button class="pick" data-v="${v}">${C[k]===v?'✓ Elegida':'Elegir Opción '+(j+1)}</button></div>`).join('')+'</div>';
 $$('.ph').forEach(bind);
 $$('.pick').forEach(b=>b.onclick=()=>{C[k]=+b.dataset.v;const y=scrollY;render();scrollTo(0,y)});
 $('#pv').disabled=!k;$('#nx').disabled=C[k]===undefined;$('#nx').textContent=k==S.length-1?'Ver resultados':'Siguiente →'}
function fin(){const n=Object.values(C).filter(v=>v==0).length,m=S.length-n;$('#pg').innerHTML=S.map(()=>'<i class="dn"></i>').join('');
 $('#ab').innerHTML=`<div class="res"><h2>Tus respuestas</h2><p>Distribución A: <b>${n} de ${S.length}</b></p><p>Distribución B: <b>${m} de ${S.length}</b></p>${S.map((s,i)=>`<p><span>${s.t}</span><b>${C[i]?'B':'A'}</b></p>`).join('')}<small class="mu">A = distribución de la app actual · B = distribución propuesta (se revela solo al final).</small></div>`;$('#nx').style.display='none'}
$('#pv').onclick=()=>{$('#nx').style.display='';k=Math.max(0,k-1);render()};$('#nx').onclick=()=>{k++;render()};render();
</script></body></html>
